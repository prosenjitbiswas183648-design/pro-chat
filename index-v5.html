<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6246e">
<title>Pro chat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #fff7fa; --surface: #ffffff; --fg: #2b1620; --muted: #8c6a79; --line: #f5dde7;
  --pink: #d6246e; --pink-2: #ff5c9d; --pink-soft: #ffe4ef; --on-pink: #ffffff;
  --mine: #fcd3e4; --theirs: #ffffff; --chat-bg: #fdeef4; --online: #22b565; --danger: #c62828;
  --shadow: 0 6px 24px -10px rgba(190, 30, 100, .45);
  --auth-bg: linear-gradient(160deg, #fff0f6, #ffd9e8 60%, #ffc2da);
  --font: "Hind Siliguri", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"] {
  --bg: #1a0f15; --surface: #26161e; --fg: #fbe9f1; --muted: #c79bb0; --line: #3b2330;
  --pink: #ff4d94; --pink-2: #ff7ab0; --pink-soft: #3d1f2e; --mine: #6a2447; --theirs: #2d1b25;
  --chat-bg: #170d13; --danger: #ff8a80; --shadow: 0 6px 24px -10px rgba(0, 0, 0, .7);
  --auth-bg: linear-gradient(160deg, #240f19, #3a1426 60%, #4d1633); color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --bg: #1a0f15; --surface: #26161e; --fg: #fbe9f1; --muted: #c79bb0; --line: #3b2330;
    --pink: #ff4d94; --pink-2: #ff7ab0; --pink-soft: #3d1f2e; --mine: #6a2447; --theirs: #2d1b25;
    --chat-bg: #170d13; --danger: #ff8a80; --shadow: 0 6px 24px -10px rgba(0, 0, 0, .7);
    --auth-bg: linear-gradient(160deg, #240f19, #3a1426 60%, #4d1633); color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; overflow: hidden; }
button, input, textarea { font-family: inherit; font-size: 1em; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--pink-2); outline-offset: 2px; }

#app { position: relative; height: 100%; max-width: 620px; margin: 0 auto; background: var(--bg); overflow: hidden; }
@media (min-width: 700px) { #app { box-shadow: 0 0 60px -20px rgba(190, 30, 100, .35); } }
.view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); }
.view.active { display: flex; }

.head { flex: none; display: flex; align-items: center; gap: 10px; color: var(--on-pink);
  background: linear-gradient(135deg, #d6246e, #ff5c9d); padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.head h1 { margin: 0; font-size: 1.2em; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .sub { font-size: .8em; opacity: .92; display: block; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .titles { flex: 1; min-width: 0; cursor: pointer; }
.head .titles h1 { flex: none; }
.head .logo-sm { width: 32px; height: 32px; border-radius: 9px; flex: none; }
.icon-btn { background: rgba(255, 255, 255, .18); border: 0; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

.avatar { --s: 44px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; position: relative; overflow: hidden;
  background: linear-gradient(135deg, #ff5c9d, #d6246e); color: #fff; display: grid; place-items: center;
  font-weight: 700; font-size: calc(var(--s) * .42); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avwrap { position: relative; flex: none; }
.dot { position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--online); border: 2px solid var(--surface); }
.ring { padding: 3px; border-radius: 50%; background: linear-gradient(135deg, #ff5c9d, #d6246e); flex: none; }
.ring.seen { background: var(--line); }
.ring .avwrap { border: 2px solid var(--surface); border-radius: 50%; }

.pane { flex: 1; min-height: 0; overflow-y: auto; display: none; padding-bottom: 90px; }
.pane.active { display: block; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.row.tap { cursor: pointer; }
.row.tap:active { background: var(--pink-soft); }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .small { font-size: .88em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { font-size: .76em; color: var(--muted); }
.row .rico { width: 40px; height: 40px; border-radius: 50%; background: var(--pink-soft); display: grid; place-items: center; font-size: 1.15em; flex: none; }
.unread { min-width: 20px; height: 20px; border-radius: 10px; background: var(--pink); color: #fff; font-size: .72em; display: grid; place-items: center; padding: 0 6px; margin-top: 2px; }
.section { padding: 14px 16px 6px; font-size: .82em; font-weight: 600; color: var(--pink); letter-spacing: .02em; }
.empty { padding: 36px 24px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); margin-bottom: 4px; font-size: 1.05em; }
.note { padding: 12px 16px; color: var(--muted); font-size: .88em; }

.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #d6246e, #ff5c9d); box-shadow: var(--shadow); }
.btn:disabled { opacity: .6; box-shadow: none; }
.btn.sm { padding: 6px 14px; font-size: .9em; border-radius: 10px; }
.btn.ghost { background: var(--pink-soft); color: var(--pink); box-shadow: none; }
.btn.danger { background: transparent; color: var(--danger); box-shadow: none; border: 1px solid var(--line); }
.field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.field:focus { outline: none; border-color: var(--pink-2); }
textarea.field { resize: vertical; min-height: 84px; }
.search { padding: 12px 16px; background: var(--bg); position: sticky; top: 0; z-index: 2; }

.nav { flex: none; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { flex: 1; border: 0; background: none; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); font-size: .76em; position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button.active { color: var(--pink); font-weight: 600; }
.nav .badge { position: absolute; top: 4px; left: 54%; min-width: 18px; height: 18px; border-radius: 9px; background: var(--pink); color: #fff; font-size: .68em; display: grid; place-items: center; padding: 0 5px; }
.fab { position: absolute; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); border-radius: 28px; padding: 13px 20px; display: flex; align-items: center; gap: 8px; z-index: 3; }
.fab svg { width: 20px; height: 20px; }

#auth { align-items: center; justify-content: center; padding: 24px; overflow-y: auto; background: var(--auth-bg); }
.auth-box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; margin: auto; }
.auth-box .logo { width: 92px; height: 92px; border-radius: 26px; align-self: center; box-shadow: var(--shadow); }
.auth-box h1 { margin: 6px 0 0; text-align: center; font-size: 1.9em; color: var(--pink); }
.auth-box .tag { margin: -6px 0 6px; text-align: center; color: var(--muted); }
.auth-box .hint { font-size: .82em; color: var(--muted); margin-top: -4px; }
.error { color: var(--danger); text-align: center; min-height: 1.3em; font-size: .92em; }
.linkbtn { background: none; border: 0; color: var(--pink); font-weight: 600; padding: 6px; }
.auth-box .btn { padding: 13px; }

/* chat */
#chatSearchBar { flex: none; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
#msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 10px; background: var(--wall, var(--chat-bg)); display: flex; flex-direction: column; gap: 3px; }
.m { display: flex; flex-direction: column; max-width: 84%; }
.m.mine { align-self: flex-end; align-items: flex-end; }
.m.theirs { align-self: flex-start; align-items: flex-start; }
.bubble { padding: 7px 11px 4px; border-radius: 16px; background: var(--theirs); box-shadow: 0 1px 1px rgba(120, 30, 70, .12); word-break: break-word; overflow-wrap: anywhere; min-width: 64px; cursor: pointer; }
.m.mine .bubble { background: var(--mine); border-bottom-right-radius: 5px; }
.m.theirs .bubble { border-bottom-left-radius: 5px; }
.bubble .who { font-size: .78em; font-weight: 700; color: var(--pink); }
.bubble .txt { white-space: pre-wrap; }
.bubble .gone { font-style: italic; color: var(--muted); }
.picwrap { position: relative; cursor: zoom-in; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.picwrap img { pointer-events: none; }
.bubble .more { border: 0; background: none; color: var(--muted); font-size: 1.1em; line-height: 1; padding: 0 4px; cursor: pointer; }
.bubble img.pic { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; display: block; max-width: min(260px, 100%); max-height: 320px; border-radius: 10px; margin: 2px 0; cursor: zoom-in; }
.bubble audio { display: block; width: 230px; max-width: 100%; height: 40px; margin: 2px 0; }
.bubble .meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: .68em; color: var(--muted); margin-top: 1px; }
.tick { font-weight: 700; letter-spacing: -2px; }
.tick.seen { color: #e0207a; }
:root[data-theme="dark"] .tick.seen { color: #ff8cbc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tick.seen { color: #ff8cbc; } }
.quote { border-left: 3px solid var(--pink); background: rgba(214, 36, 110, .09); border-radius: 8px; padding: 3px 8px; margin-bottom: 4px; font-size: .86em; }
.quote b { color: var(--pink); display: block; font-size: .92em; }
.quote span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 230px; color: var(--muted); }
.reacts { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.reacts span { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 7px; font-size: .82em; }
.card { display: block; min-width: 200px; }
.card .ct { font-weight: 700; }
.card .cs { font-size: .88em; color: var(--muted); }
.card a { color: var(--pink); font-weight: 600; }
.opt { position: relative; display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; margin-top: 5px; overflow: hidden; }
.opt i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pink-soft); z-index: 0; }
.opt span { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 10px; }
.opt.mine-v { border-color: var(--pink); }
.evbtns { display: flex; gap: 6px; margin-top: 6px; }
.composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.composer .field { border-radius: 22px; padding: 10px 16px; max-height: 120px; resize: none; line-height: 1.4; }
.circle { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; }
.circle.attach { background: var(--pink-soft); color: var(--pink); }
.circle.send { background: linear-gradient(135deg, #d6246e, #ff5c9d); color: #fff; }
.circle svg { width: 22px; height: 22px; }
#replyBar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg); border-top: 1px solid var(--line); font-size: .88em; }
#replyBar .quote { flex: 1; margin: 0; min-width: 0; }
#recBar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
#recBar .rd { color: #e0207a; font-weight: 700; flex: 1; }

/* sheets and forms */
#sheetWrap { position: fixed; inset: 0; z-index: 40; background: rgba(20, 5, 12, .5); display: flex; align-items: flex-end; justify-content: center; }
#sheet { width: 100%; max-width: 620px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 14px calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 82vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
#sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; margin-bottom: 4px; }
.stitle { font-weight: 700; font-size: 1.05em; padding: 2px 2px 4px; }
.sitem { border: 0; background: none; text-align: left; padding: 12px 8px; border-radius: 10px; font-size: 1em; display: block; width: 100%; }
.sitem:active { background: var(--pink-soft); }
.sitem.danger { color: var(--danger); }
.emojis { display: flex; justify-content: space-around; padding: 4px 0 8px; border-bottom: 1px solid var(--line); }
.emojis button { border: 0; background: none; font-size: 1.7em; border-radius: 50%; width: 46px; height: 46px; }
.emojis button.on { background: var(--pink-soft); }
.agrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 0; }
.agrid button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .9em; }
.agrid .ai { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6em; background: var(--pink-soft); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 0; }
.swatches button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; }
.swatches button.on { border-color: var(--pink); }

/* sub pages */
#subBody { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 30px; }
.prof { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 20px 8px; }
.prof .avatar { --s: 112px; }
.prof .box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; }
.prof .info { text-align: center; color: var(--muted); font-size: .92em; }
.pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.check { width: 22px; height: 22px; accent-color: var(--pink); flex: none; }
.faq b { display: block; margin-bottom: 2px; }
.faq p { margin: 0; color: var(--muted); }

/* stories */
.stext { display: grid; place-items: center; text-align: center; padding: 28px; font-size: 1.6em; font-weight: 600; color: #fff; width: 100%; height: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
#story { position: fixed; inset: 0; z-index: 55; background: #000; display: flex; flex-direction: column; max-width: 620px; margin: 0 auto; color: #fff; }
#storyBars { display: flex; gap: 4px; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 6px; }
#storyBars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .35); }
#storyBars i.done { background: #fff; }
#storyHead { display: flex; align-items: center; gap: 10px; padding: 4px 12px 8px; }
#storyHead .grow { flex: 1; min-width: 0; line-height: 1.2; }
#storyHead small { opacity: .8; }
#storyBody { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
#storyBody img { max-width: 100%; max-height: 100%; }
#storyBody .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px; background: linear-gradient(transparent, rgba(0, 0, 0, .7)); text-align: center; }
.zone { position: absolute; top: 0; bottom: 0; width: 38%; background: none; border: 0; }
#storyFoot { display: flex; justify-content: center; gap: 10px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
#storyFoot .btn { background: rgba(255, 255, 255, .18); box-shadow: none; }

#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: #3a1a29; color: #fff; padding: 10px 18px; border-radius: 22px; font-size: .92em; opacity: 0; pointer-events: none; transition: .25s; z-index: 70; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#viewer { position: fixed; inset: 0; background: rgba(20, 5, 12, .94); z-index: 60; display: grid; place-items: center; padding: 12px; }
#viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">

  <!-- লগইন / সাইন আপ -->
  <section id="auth" class="view active">
    <div class="auth-box">
      <img class="logo" src="icon-192.png" alt="Pro chat">
      <h1>Pro chat</h1>
      <p class="tag">বন্ধুদের সাথে সহজ চ্যাট</p>
      <input id="name" class="field" type="text" placeholder="আপনার নাম" autocomplete="name" hidden>
      <input id="login" class="field" type="text" placeholder="ইমেইল বা ফোন নম্বর" autocomplete="username" autocapitalize="none">
      <input id="password" class="field" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="current-password">
      <div id="authHint" class="hint" hidden>ফোন নম্বর দিলে পরে সেই নম্বর ও পাসওয়ার্ড দিয়েই লগইন করতে পারবেন। পাসওয়ার্ড মনে রাখুন, ভুলে গেলে ফেরত পাওয়ার উপায় নেই।</div>
      <div id="authError" class="error" role="alert"></div>
      <button id="authBtn" class="btn">লগইন</button>
      <button id="toggleBtn" class="linkbtn">অ্যাকাউন্ট নেই? সাইন আপ করুন</button>
    </div>
  </section>

  <!-- মূল পর্দা -->
  <section id="main" class="view">
    <header class="head">
      <img class="logo-sm" src="icon-192.png" alt="">
      <h1 id="mainTitle">Pro chat</h1>
    </header>

    <div id="paneChats" class="pane active"><div id="chatList"></div></div>

    <div id="paneStatus" class="pane"><div id="statusList"></div></div>

    <div id="paneFriends" class="pane">
      <div class="search">
        <form id="searchForm" style="display:flex;gap:8px" autocomplete="off">
          <input id="searchBox" class="field" type="search" inputmode="search" placeholder="বন্ধুর ফোন নম্বর বা ইমেইল" autocomplete="off">
          <button class="btn" type="submit">খুঁজুন</button>
        </form>
        <div style="font-size:.8em;color:var(--muted);margin:6px 2px 0">নাম দিয়ে খোঁজা যায় না। সঠিক নম্বর বা ইমেইল জানা থাকলে তবেই পাওয়া যাবে।</div>
      </div>
      <div id="searchResults"></div>
      <div id="requestBox"></div>
      <div id="friendList"></div>
    </div>

    <div id="paneSettings" class="pane"><div id="settingsList"></div></div>

    <button id="fab" class="btn fab"></button>

    <nav class="nav">
      <button data-tab="Chats" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>চ্যাট<span id="badgeChats" class="badge" hidden></span>
      </button>
      <button data-tab="Status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5" stroke-dasharray="4 3"/><circle cx="12" cy="12" r="3.5"/></svg>স্টোরি<span id="badgeStatus" class="badge" hidden></span>
      </button>
      <button data-tab="Friends">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 5.5a3.2 3.2 0 0 1 0 6.2M18.5 14.3c2 .6 3.2 2.5 3.2 5.2"/></svg>বন্ধু<span id="badgeFriends" class="badge" hidden></span>
      </button>

function normPhone(s) {
  s = String(s).replace(/[০-৯]/g, (c) => "০১২৩৪৫৬৭৮৯".indexOf(c));
  let d = s.replace(/\D/g, "");

  if (d.startsWith("880")) { /* ok */ }
  else if (d.startsWith("0") && d.length === 11) d = "880" + d.slice(1);
  else if (d.length === 10 && d.startsWith("1")) d = "880" + d;
  return (d.length >= 10 && d.length <= 15) ? d : null;
}

function fmtTime(t) {
  const m = typeof t === "number" ? t : ms(t); if (!m) return "";
  try { return new Date(m).toLocaleTimeString("bn-BD", { hour: "numeric", minute: "2-digit" }); }
  catch { return new Date(m).toLocaleTimeString(); }
}
function fmtListTime(t) {
  const m = typeof t === "number" ? t : ms(t); if (!m) return "";
  const d = new Date(m), now = new Date();
  if (d.toDateString() === now.toDateString()) return fmtTime(m);
  try { return d.toLocaleDateString("bn-BD", { day: "numeric", month: "short" }); } catch { return d.toLocaleDateString(); }
}

/* image / file helpers: everything is shrunk and kept in the database (no paid Storage needed) */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}
async function shrink(file, max) {
  if (settings.imgq === "small") max = Math.min(max, 640);
  const img = await loadImage(file);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
  let q = settings.imgq === "small" ? 0.55 : 0.72, out = c.toDataURL("image/jpeg", q);
  while (out.length > 800000 && q > 0.35) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
  if (out.length > 800000) throw new Error("big");
  return out;
}
async function squarePhoto(file, size) {
  const img = await loadImage(file);
  const m = Math.min(img.width, img.height);
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
  return c.toDataURL("image/jpeg", 0.8);
}

}

}

      await setDoc(doc(db, "lookup", id.phone ? "p_" + id.phone : "e_" + id.email), { uid: cred.user.uid });

  if (!snap.exists()) {
    await setDoc(ref, {
      uid: user.uid, name, about: "",
      email: isPhone ? "" : (user.email || ""), phone: isPhone ? user.email.slice(0, -PHONE_DOMAIN.length) : "",
      photo: "", createdAt: serverTimestamp(), lastSeen: serverTimestamp()
    });
  }
  const key = isPhone ? "p_" + user.email.slice(0, -PHONE_DOMAIN.length) : "e_" + (user.email || "").toLowerCase();
  const lk = doc(db, "lookup", key);
  if (!(await getDoc(lk)).exists()) await setDoc(lk, { uid: user.uid });
}

async function startSession(user) {
  if (started) return; started = true; me = user; firstChats = true;
  try { await ensureUserDoc(user); } catch (e) { onErr(e); }
  ensureProfile(user.uid);
  checkAdmin();
  sessionUnsubs.push(onSnapshot(query(collection(db, "friendships"), where("users", "array-contains", user.uid)), (snap) => {
    friendships = snap.docs.map((d) => ({ id: d.id, ...d.data(SNAP) }));
    friendships.forEach((f) => f.users.forEach(ensureProfile));
    scheduleRender();
  }, onErr));
  sessionUnsubs.push(onSnapshot(query(collection(db, "chats"), where("members", "array-contains", user.uid)), (snap) => {
    const prev = new Map(chats.map((c) => [c.id, c]));
    chats = snap.docs.map((d) => ({ id: d.id, ...d.data(SNAP) }));
    chats.forEach((c) => c.members.forEach(ensureProfile));
    if (!firstChats) chats.forEach((c) => notifyIfNew(prev.get(c.id), c));
    firstChats = false;
    scheduleRender();
  }, onErr));
  sessionUnsubs.push(onSnapshot(query(collection(db, "stories"), where("audience", "array-contains", user.uid), limit(300)), (snap) => {
    stories = snap.docs.map((d) => ({ id: d.id, ...d.data(SNAP) }));
    stories.forEach((s) => ensureProfile(s.uid));
    // tidy up my own expired stories
    stories.filter((s) => s.uid === user.uid && s.exp < Date.now()).forEach((s) => removeStory(s).catch(() => {}));
    scheduleRender();
  }, onErr));
  sessionUnsubs.push(onSnapshot(query(collection(db, "blocks"), where("by", "==", user.uid)), (snap) => {
    blocks = snap.docs.map((d) => ({ id: d.id, ...d.data(SNAP) }));
    blocks.forEach((b) => ensureProfile(b.who));
    scheduleRender();
  }, onErr));
  beat(); beatTimer = setInterval(beat, 30000);
  tickTimer = setInterval(scheduleRender, 30000);
  history.replaceState({ v: "main" }, "");
  show("main"); setTab("Chats"); renderAll();
}
function endSession() {
  started = false; me = null; isAdmin = false;
  sessionUnsubs.forEach((u) => u()); sessionUnsubs = [];
  profileUnsubs.forEach((u) => u()); profileUnsubs.clear(); profiles.clear();
  closeChatListeners(); hideStory(); closeSheet();
  friendships = []; chats = []; stories = []; blocks = []; current = null; currentData = null; subStack = [];
  clearInterval(beatTimer); clearInterval(tickTimer);
  $("login").value = ""; $("password").value = ""; $("name").value = "";
  if (!isLogin) $("toggleBtn").click();
  $("authError").textContent = "";
  show("auth");
}

async function runSearch() {
  const q = $("searchBox").value.trim();
  if (!q) { searchState = { status: "idle", uid: null }; return renderSearchResults(); }
  let key = null;
  if (q.includes("@")) { if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(q)) key = "e_" + q.toLowerCase(); }
  else { const p = normPhone(q); if (p) key = "p_" + p; }
  if (!key) { searchState = { status: "invalid", uid: null }; return renderSearchResults(); }
  searchState = { status: "loading", uid: null }; renderSearchResults();
  try {
    const l = await getDoc(doc(db, "lookup", key));
    if (!l.exists()) searchState = { status: "none", uid: null };
    else if (l.data().uid === me.uid) searchState = { status: "self", uid: null };
    else {
      const uid = l.data().uid, u = await getDoc(doc(db, "users", uid));
      if (u.exists()) { profiles.set(uid, u.data(SNAP)); ensureProfile(uid); searchState = { status: "found", uid }; }

  } catch (e) { onErr(e); searchState = { status: "idle", uid: null }; }
  renderSearchResults();
}

/* shrink a video to a small WebM (max 30 s, 480 px, ~300 kbps) so it fits in the free database */
async function prepVideo(file) {
  const url = URL.createObjectURL(file);
  const v = document.createElement("video"); v.src = url; v.playsInline = true; v.preload = "auto";
  try {
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("video")); });
    if (v.duration === Infinity) { v.currentTime = 1e9; await new Promise((r) => { v.ontimeupdate = r; }); v.currentTime = 0; }
    const dur = Math.min(v.duration || 0, 30);
    if (!dur || !isFinite(dur)) throw new Error("video");
    if (file.size <= 500 * 1024 && v.duration <= 30) return file;
    const sc = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight));
    const cw = Math.max(2, Math.round(v.videoWidth * sc / 2) * 2), ch = Math.max(2, Math.round(v.videoHeight * sc / 2) * 2);
    const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch; const ctx = cv.getContext("2d");
    const out = cv.captureStream(20);
    const ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
    const dest = ac.createMediaStreamDestination(); ac.createMediaElementSource(v).connect(dest);
    dest.stream.getAudioTracks().forEach((t) => out.addTrack(t));
    const mime = ["video/webm;codecs=vp8,opus", "video/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
    const mr = new MediaRecorder(out, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: 280000, audioBitsPerSecond: 32000 });
    const chunks = []; mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const finished = new Promise((res) => { mr.onstop = res; });
    v.currentTime = 0; mr.start(500); await v.play();
    let lastP = -1;
    await new Promise((res) => {
      const tick = () => {
        ctx.drawImage(v, 0, 0, cw, ch);
        const p = Math.min(99, Math.floor(v.currentTime / dur * 10) * 10);
        if (p !== lastP) { lastP = p; toast("ভিডিও ছোট করা হচ্ছে… " + p + "%"); }
        if (v.ended || v.currentTime >= dur) return res();
        requestAnimationFrame(tick);
      };
      tick();
    });
    v.pause(); mr.stop(); await finished; ac.close().catch(() => {});
    const blob = new Blob(chunks, { type: mr.mimeType || "video/webm" });
    if (blob.size > 2000 * 1024) throw new Error("toobig");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
/* cut a song to a short clip (max 25 s) so it fits in the database */
async function clipAudio(file, startSec) {
  const ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
  const audio = await ac.decodeAudioData(await file.arrayBuffer());
  const start = Math.min(Math.max(0, startSec || 0), Math.max(0, audio.duration - 1));
  const dur = Math.min(25, audio.duration - start);
  const dest = ac.createMediaStreamDestination(); const src = ac.createBufferSource(); src.buffer = audio; src.connect(dest);
  const mime = ["audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
  const mr = new MediaRecorder(dest.stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: 40000 });
  const chunks = []; mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise((res) => { mr.onstop = res; });
  mr.start(); src.start(0, start, dur); setTimeout(() => { try { mr.stop(); } catch {} }, dur * 1000 + 200);
  await done; ac.close().catch(() => {});
  return { data: await toDataURL(new Blob(chunks, { type: mr.mimeType || "audio/webm" })), name: file.name.replace(/\.[^.]+$/, "").slice(0, 40) };
}

function composeStory(init) {

    if (kind === "video") b.appendChild(el("div", "note", "🎥 ভিডিও প্রস্তুত (" + Math.round(init.blob.size / 1024) + " KB)"));

/* ---------------- messages ---------------- */
function tickState(m) {
  if (m.pending) return "pending";
  const c = currentData; if (!c) return "sent";
  const others = c.members.filter((u) => u !== me.uid); const t = ms(m.createdAt);
  const myOff = P(me.uid) && P(me.uid).noReceipts;
  const seen = !myOff && others.length && t && others.every((u) => !(P(u) && P(u).noReceipts) && ms((c.reads || {})[u]) >= t);
  return seen ? "seen" : "sent";
}
function previewOf(p) {
  return { image: "📷 ছবি", audio: "🎤 ভয়েস মেসেজ", file: "📄 " + (p.fileName || "ফাইল"), location: "📍 লোকেশন", contact: "👤 " + (p.contact ? p.contact.name : ""),
    poll: "📊 " + (p.poll ? p.poll.q : ""), event: "📅 " + (p.event ? p.event.title : "") }[p.kind] || (p.text || "").slice(0, 80);
}
function msgPreview(m) { return m.deleted ? "মেসেজটি মুছে ফেলা হয়েছে" : previewOf(m); }

function buildMsg(m) {
  const mine = m.senderId === me.uid;
  const wrap = el("div", "m " + (mine ? "mine" : "theirs"));
  const bubble = el("div", "bubble"); const body = el("div", "body"); const reacts = el("div", "reacts");
  const meta = el("div", "meta"); const time = el("span"); const tick = el("span", "tick");
  const more = el("button", "more", "⌄"); more.type = "button"; more.setAttribute("aria-label", "মেসেজ মেনু"); more.onclick = (ev) => { ev.stopPropagation(); if (wrap._m) msgSheet(wrap._m); };
  meta.append(more, time); if (mine) meta.append(tick);
  bubble.append(body, meta); wrap.append(bubble, reacts);
  wrap._r = { mine, bubble, body, time, tick, who: null, reacts };
  bubble.onclick = (ev) => { if (ev.target.closest("a,button,audio")) return; if (wrap._m) msgSheet(wrap._m); };
  // long-press: show our own menu instead of the browser's "Copy/Download image" menu
  wrap.addEventListener("contextmenu", (ev) => { ev.preventDefault(); if (wrap._m) msgSheet(wrap._m); });
  return wrap;
}
function votesOf(m) { return m.votes || {}; }
function fillMsg(node, m) {
  const r = node._r;
  const sig = [m.deleted ? 1 : 0, m.text, (m.image || "").length, m.kind, (m.file || "").length, JSON.stringify(m.reactions || {}), JSON.stringify(m.votes || {})].join("|");
  node._m = m;
  if (node._sig === sig) return;
  node._sig = sig; r.body.textContent = ""; r.reacts.textContent = "";
  if (m.deleted) { r.body.appendChild(el("div", "gone", "🚫 মেসেজটি মুছে ফেলা হয়েছে")); return; }
  if (m.reply) { const q = el("div", "quote"); q.append(el("b", null, m.reply.who || ""), el("span", null, m.reply.text || "")); r.body.appendChild(q); }
  const kind = m.kind || (m.image ? "image" : "text");
  if (m.image) { const pw = el("div", "picwrap"); const img = document.createElement("img"); img.className = "pic"; img.src = m.image; img.alt = "ছবি"; img.draggable = false; pw.appendChild(img); pw.onclick = (ev) => { ev.stopPropagation(); openViewer(m.image); }; r.body.appendChild(pw); }
  if (kind === "audio" && m.file) { const a = document.createElement("audio"); a.controls = true; a.preload = "none"; a.src = m.file; r.body.appendChild(a); }
  if (kind === "file" && m.file) {
    const c = el("div", "card"); c.appendChild(el("div", "ct", "📄 " + (m.fileName || "ফাইল")));
    const a = el("a", null, "ডাউনলোড"); a.href = m.file; a.download = m.fileName || "file"; c.appendChild(a); r.body.appendChild(c);
  }
  if (kind === "location" && m.loc) {
    const c = el("div", "card"); c.appendChild(el("div", "ct", "📍 লোকেশন"));
    const a = el("a", null, "ম্যাপে দেখুন"); a.target = "_blank"; a.rel = "noopener";
    a.href = "https://www.openstreetmap.org/?mlat=" + m.loc.lat + "&mlon=" + m.loc.lng + "#map=16/" + m.loc.lat + "/" + m.loc.lng; c.appendChild(a); r.body.appendChild(c);
  }
  if (kind === "contact" && m.contact) {
    const c = el("div", "card"); c.appendChild(el("div", "ct", "👤 " + m.contact.name));
    const a = el("a", null, m.contact.phone); a.href = "tel:" + m.contact.phone; c.appendChild(a); r.body.appendChild(c);
  }
  if (kind === "poll" && m.poll) {
    const c = el("div", "card"); c.appendChild(el("div", "ct", "📊 " + m.poll.q));
    const v = votesOf(m), total = Object.keys(v).length;
    m.poll.options.forEach((o, i) => {
      const n = Object.values(v).filter((x) => x === i).length;
      const b = el("button", "opt" + (v[me.uid] === i ? " mine-v" : "")); b.type = "button";
      const bar = el("i"); bar.style.width = (total ? Math.round(n * 100 / total) : 0) + "%";
      const sp = el("span"); sp.append(el("span", null, o), el("span", null, String(n))); b.append(bar, sp);
      b.onclick = (ev) => { ev.stopPropagation(); updateDoc(doc(db, "chats", current, "messages", m.id), { ["votes." + me.uid]: i }).catch(onErr); };
      c.appendChild(b);
    });
    c.appendChild(el("div", "cs", total + " ভোট")); r.body.appendChild(c);
  }
  if (kind === "event" && m.event) {
    const c = el("div", "card"); c.appendChild(el("div", "ct", "📅 " + m.event.title));
    if (m.event.when) c.appendChild(el("div", "cs", new Date(m.event.when).toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" })));
    if (m.event.place) c.appendChild(el("div", "cs", "স্থান: " + m.event.place));
    const v = votesOf(m), yes = Object.values(v).filter((x) => x === "y").length, no = Object.values(v).filter((x) => x === "n").length;
    const row = el("div", "evbtns");
    [["y", "✅ যাব (" + yes + ")"], ["n", "❌ যাব না (" + no + ")"]].forEach(([k, label]) => {
      const b = actionBtn(label, v[me.uid] === k ? "" : "ghost", (ev) => { ev.stopPropagation(); updateDoc(doc(db, "chats", current, "messages", m.id), { ["votes." + me.uid]: k }).catch(onErr); });
      row.appendChild(b);
    });
    c.appendChild(row); r.body.appendChild(c);
  }
  if (m.text) r.body.appendChild(el("div", "txt", m.text));
  const rc = {}; Object.values(m.reactions || {}).forEach((e) => { rc[e] = (rc[e] || 0) + 1; });
  Object.entries(rc).forEach(([e, n]) => r.reacts.appendChild(el("span", null, e + (n > 1 ? " " + n : ""))));
}
function visibleMsgs() {
  const cl = LS.get("pc_clear", {})[current] || 0, f = chatFilter.toLowerCase();
  return lastMsgs.filter((m) => !(m.hiddenFor && m.hiddenFor[me.uid]) && (!cl || m.pending || ms(m.createdAt) > cl) && (!f || (m.text || "").toLowerCase().includes(f)));
}
function paintMessages() {
  if (!current) return;
  const box = $("msgs"); const list = visibleMsgs();
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140 || !box.children.length;
  const ids = new Set(list.map((m) => m.id));
  [...msgEls.keys()].forEach((k) => { if (!ids.has(k)) { msgEls.get(k).remove(); msgEls.delete(k); } });
  list.forEach((m, i) => {
    let node = msgEls.get(m.id);
    if (!node) { node = buildMsg(m); msgEls.set(m.id, node); }
    fillMsg(node, m);
    if (box.children[i] !== node) box.insertBefore(node, box.children[i] || null);
  });
  updateMsgMeta();
  if (near) box.scrollTop = box.scrollHeight;
}
function updateMsgMeta() {
  if (!current) return;
  const group = currentData && currentData.type === "group";
  msgEls.forEach((node) => {
    const m = node._m, r = node._r; if (!m) return;
    r.time.textContent = fmtTime(m.createdAt);
    if (r.mine) {
      const s = tickState(m);
      r.tick.textContent = s === "pending" ? "🕓" : (s === "sent" ? "✓" : "✓✓");
      r.tick.className = "tick" + (s === "seen" ? " seen" : "");
    } else if (group) {
      if (!r.who) { r.who = el("div", "who"); r.bubble.insertBefore(r.who, r.body); }
      r.who.textContent = pName(m.senderId);
    }
  });
}
function markRead() {
  if (!current || !currentData || document.hidden) return;
  const last = lastMsgs[lastMsgs.length - 1];
  if (!last || last.senderId === me.uid || last.pending) return;
  const t = ms(last.createdAt), mineAt = ms((currentData.reads || {})[me.uid]);
  if (mineAt && mineAt >= t) return;
  if (markedFor === last.id) return; markedFor = last.id;
  updateDoc(doc(db, "chats", current), { ["reads." + me.uid]: serverTimestamp() }).catch(() => { markedFor = null; });

  await addDoc(collection(db, "chats", chatId, "messages"), { ...base, ...payload });
  await updateDoc(doc(db, "chats", chatId), { lastMessage: preview, lastSender: me.uid, updatedAt: serverTimestamp(), ["reads." + me.uid]: serverTimestamp() });
}
async function sendHere(payload) {
  if (!current) return;
  const p = { ...payload }; if (replyTo) { p.reply = replyTo; setReply(null); }
  try { await sendRaw(current, p, previewOf(payload)); }
  catch (e) { onErr(e); toast("মেসেজ পাঠানো যায়নি"); }
}

  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (f.size > 600 * 1024) return toast("ফাইল বড় (সর্বোচ্চ প্রায় ৬০০ KB)");
  try { const data = await toDataURL(f); await sendHere({ kind: "file", file: data, fileName: f.name.slice(0, 80), fileType: f.type || "" }); }
  catch (er) { onErr(er); }
};
function sendLocation() {
  if (!navigator.geolocation) return toast("এই ফোনে লোকেশন সম্ভব নয়");
  toast("লোকেশন নেওয়া হচ্ছে…");
  navigator.geolocation.getCurrentPosition(
    (pos) => sendHere({ kind: "location", loc: { lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5) } }),
    () => toast("লোকেশনের অনুমতি দিন"), { enableHighAccuracy: true, timeout: 15000 });
}
async function sendContact() {
  if (navigator.contacts && navigator.contacts.select) {
    try {
      const r = await navigator.contacts.select(["name", "tel"], { multiple: false });
      if (r && r[0] && r[0].tel && r[0].tel[0]) return sendHere({ kind: "contact", contact: { name: ((r[0].name && r[0].name[0]) || "নামহীন").slice(0, 40), phone: String(r[0].tel[0]).slice(0, 20) } });
    } catch { /* fall through to manual form */ }
  }
  openForm("কন্টাক্ট পাঠান", [{ key: "name", ph: "নাম", max: 40 }, { key: "phone", type: "tel", ph: "ফোন নম্বর", max: 20 }], "পাঠান",
    (v) => { if (!v.name || !v.phone) return "নাম ও নম্বর লিখুন"; sendHere({ kind: "contact", contact: { name: v.name, phone: v.phone } }); return null; });
}
function makePoll() {
  openForm("পোল তৈরি করুন", [{ key: "q", ph: "প্রশ্ন", max: 120 }, { key: "o1", ph: "অপশন ১", max: 60 }, { key: "o2", ph: "অপশন ২", max: 60 }, { key: "o3", ph: "অপশন ৩ (ঐচ্ছিক)", max: 60 }, { key: "o4", ph: "অপশন ৪ (ঐচ্ছিক)", max: 60 }], "পাঠান",
    (v) => { const o = [v.o1, v.o2, v.o3, v.o4].filter(Boolean); if (!v.q || o.length < 2) return "প্রশ্ন ও কমপক্ষে ২টি অপশন দিন"; sendHere({ kind: "poll", poll: { q: v.q, options: o } }); return null; });
}
function makeEvent() {
  openForm("ইভেন্ট তৈরি করুন", [{ key: "title", ph: "ইভেন্টের নাম", max: 80 }, { key: "when", type: "datetime-local" }, { key: "place", ph: "স্থান (ঐচ্ছিক)", max: 80 }], "পাঠান",
    (v) => { if (!v.title) return "নাম লিখুন"; const t = v.when ? new Date(v.when).getTime() : 0; sendHere({ kind: "event", event: { title: v.title, when: t || 0, place: v.place } }); return null; });
}

/* voice messages */
let rec = null;
function fmtDur(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
$("micBtn").onclick = async () => {
  if (!current) return;
  let stream;
  try { if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error("nomic"); stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return micHelp(); }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
  const chunks = []; mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const r = { mr, stream, chunks, chatId: current, start: Date.now(), cancel: false, timer: null };
  rec = r;
  mr.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop()); clearInterval(r.timer);
    if (rec === r) rec = null; $("recBar").hidden = true; $("sendForm").hidden = false;
    if (r.cancel || !chunks.length) return;
    try {
      const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" }); const data = await toDataURL(blob);
      if (data.length > 850000) return toast("রেকর্ডিং বড় হয়ে গেছে");
      if (r.chatId !== current) return toast("চ্যাট বদলে গেছে, ভয়েস পাঠানো হয়নি");
      await sendHere({ kind: "audio", file: data, fileType: blob.type });
    } catch (e) { onErr(e); }
  };
  mr.start(); $("sendForm").hidden = true; $("recBar").hidden = false; $("recT").textContent = "0:00";
  r.timer = setInterval(() => { const s = Math.floor((Date.now() - r.start) / 1000); $("recT").textContent = fmtDur(s); if (s >= 90) stopRec(false); }, 500);
};
function stopRec(cancel) { if (!rec) return; rec.cancel = cancel; try { rec.mr.stop(); } catch { rec.stream.getTracks().forEach((t) => t.stop()); } }
function cancelRec() { if (rec) stopRec(true); }
$("recCancel").onclick = () => stopRec(true);
$("recSend").onclick = () => stopRec(false);

function openViewer(src) { const v = $("viewer"); v.querySelector("img").src = src; v.hidden = false; }
$("viewer").onclick = () => { $("viewer").hidden = true; };

/* ---------------- groups ---------------- */
function openNewGroup() {
  $("groupName").value = "";
  const box = $("groupPick"); box.textContent = "";
  const friends = friendIds();
  if (!friends.length) {
    const e = el("div", "empty"); e.append(el("b", null, "আগে বন্ধু যোগ করুন"), "গ্রুপে শুধু বন্ধুদের রাখা যায়।"); box.appendChild(e);
  }
  friends.forEach((uid) => {
    const row = el("label", "row tap"); row.appendChild(avatar(P(uid), 42));
    const g = el("div", "grow"); g.appendChild(el("div", "name", pName(uid))); row.appendChild(g);
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "check"; cb.value = uid; row.appendChild(cb);
    box.appendChild(row);
  });
  history.pushState({ v: "group" }, ""); show("group");
}
$("groupBack").onclick = () => history.back();
$("groupCreate").onclick = async () => {
  const name = $("groupName").value.trim();
  const picked = [...$("groupPick").querySelectorAll("input:checked")].map((i) => i.value);
  if (!name) return toast("গ্রুপের নাম লিখুন");
  if (!picked.length) return toast("কমপক্ষে একজন বন্ধু বেছে নিন");
  $("groupCreate").disabled = true;
  try {
    const ref = doc(collection(db, "chats"));
    await setDoc(ref, {
      type: "group", name, members: [me.uid, ...picked], createdBy: me.uid, reads: {},
      createdAt: serverTimestamp(), updatedAt: serverTimestamp(), lastMessage: "গ্রুপ তৈরি হয়েছে", lastSender: me.uid
    });
    openChat(ref.id, true, { type: "group", name, members: [me.uid, ...picked] });
  } catch (e) { onErr(e); toast("গ্রুপ তৈরি করা যায়নি"); }
  finally { $("groupCreate").disabled = false; }
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
