<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#128C7E">
<title>Pro chat</title>
<style>
  :root { --green: #128C7E; --sent: #dcf8c6; --bg: #ece5dd; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, "Noto Sans Bengali", sans-serif; background: var(--bg); }
  .view { display: none; height: 100%; flex-direction: column; }
  .view.active { display: flex; }
  header { background: var(--green); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  header h1 { font-size: 1.15rem; margin: 0; flex: 1; font-weight: 600; }
  header button { background: none; border: 0; color: #fff; font-size: 1.1rem; cursor: pointer; padding: 4px 8px; }

  /* login */
  #auth { justify-content: center; align-items: center; background: #fff; padding: 24px; }
  .box { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  .box h2 { text-align: center; margin: 0 0 8px; }
  .logo { font-size: 3rem; text-align: center; }
  input[type=text], input[type=email], input[type=password] { font-size: 1rem; padding: 12px; border: 1px solid #ccc; border-radius: 10px; width: 100%; }
  .primary { background: var(--green); color: #fff; border: 0; padding: 13px; border-radius: 10px; font-size: 1rem; cursor: pointer; }
  .primary:disabled { opacity: .6; }
  .link { background: none; border: 0; color: var(--green); cursor: pointer; font-size: .95rem; padding: 6px; }
  .error { color: #c62828; text-align: center; min-height: 1.2em; font-size: .92rem; }

  /* user list */
  #userList { flex: 1; overflow-y: auto; background: #fff; }
  .user { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-weight: 600; flex: none; }
  .user small { color: #666; display: block; }
  .empty { padding: 32px 20px; text-align: center; color: #555; }

  /* chat */
  #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .msg { max-width: 78%; padding: 7px 11px 4px; border-radius: 12px; background: #fff; align-self: flex-start; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.me { background: var(--sent); align-self: flex-end; }
  .msg small { display: block; text-align: right; font-size: .7rem; color: #666; }
  .composer { display: flex; gap: 8px; padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .composer input { flex: 1; border-radius: 22px; border: 0; padding: 12px 16px; font-size: 1rem; }
  .composer button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--green); color: #fff; font-size: 1.2rem; cursor: pointer; }
</style>
</head>
<body>

<!-- লগইন / সাইন আপ -->
<div id="auth" class="view active">
  <div class="box">
    <div class="logo">💬</div>
    <h2 id="authTitle">লগইন করুন</h2>
    <input id="name" type="text" placeholder="আপনার নাম" autocomplete="name" hidden>
    <input id="email" type="email" placeholder="ইমেইল" autocomplete="email">
    <input id="password" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="current-password">
    <div id="authError" class="error"></div>
    <button id="authBtn" class="primary">লগইন</button>
    <button id="toggleBtn" class="link">অ্যাকাউন্ট নেই? সাইন আপ করুন</button>
  </div>
</div>

<!-- ইউজার তালিকা -->
<div id="users" class="view">
  <header><h1>Pro chat</h1><button id="logoutBtn" title="লগআউট">⎋ লগআউট</button></header>
  <div id="userList"></div>
</div>

<!-- চ্যাট -->
<div id="chat" class="view">
  <header><button id="backBtn" title="পিছনে">←</button><h1 id="chatName"></h1></header>
  <div id="messages"></div>
  <form class="composer" id="sendForm">
    <input id="msgInput" type="text" placeholder="মেসেজ লিখুন" autocomplete="off">
    <button type="submit" title="পাঠান">➤</button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, query, orderBy, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ====== এখানে আপনার Firebase কনফিগ বসান ======
const firebaseConfig = {
  apiKey: "AIzaSyBJQWzfOa5bYCSnzKJY6AOCqNVkAYYYDyE",
  authDomain: "prochat-753ab.firebaseapp.com",
  projectId: "prochat-753ab",
  storageBucket: "prochat-753ab.firebasestorage.app",
  messagingSenderId: "849385728672",
  appId: "1:849385728672:web:b5af76a78541e4657ab7c5"
};
// ===============================================

const $ = (id) => document.getElementById(id);
const configured = !firebaseConfig.apiKey.startsWith("YOUR_");
let auth, db;
if (configured) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
} else {
  $("authError").textContent = "Firebase কনফিগ এখনো বসানো হয়নি";
}

let isLogin = true;
let unsubUsers = null, unsubMsgs = null;
let otherUser = null;

function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  $(id).classList.add("active");
}

function errorText(code) {
  const map = {
    "auth/invalid-email": "ইমেইল সঠিক নয়",
    "auth/invalid-credential": "ইমেইল বা পাসওয়ার্ড ভুল",
    "auth/user-not-found": "ইমেইল বা পাসওয়ার্ড ভুল",
    "auth/wrong-password": "ইমেইল বা পাসওয়ার্ড ভুল",
    "auth/email-already-in-use": "এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট আছে",
    "auth/weak-password": "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন",
    "auth/network-request-failed": "ইন্টারনেট সংযোগ পরীক্ষা করুন",
    "auth/unauthorized-domain": "এই সাইটের ঠিকানা Firebase-এর Authorized domains-এ যোগ করুন"
  };
  return map[code] || "সমস্যা হয়েছে: " + code;
}

// লগইন / সাইন আপ পরিবর্তন
$("toggleBtn").onclick = () => {
  isLogin = !isLogin;
  $("authTitle").textContent = isLogin ? "লগইন করুন" : "নতুন অ্যাকাউন্ট";
  $("authBtn").textContent = isLogin ? "লগইন" : "সাইন আপ";
  $("toggleBtn").textContent = isLogin ? "অ্যাকাউন্ট নেই? সাইন আপ করুন" : "আগেই অ্যাকাউন্ট আছে? লগইন করুন";
  $("name").hidden = isLogin;
  $("authError").textContent = "";
};

$("authBtn").onclick = async () => {
  if (!configured) return;
  const email = $("email").value.trim();
  const password = $("password").value;
  const name = $("name").value.trim();
  if (!email || !password || (!isLogin && !name)) {
    $("authError").textContent = "সব ঘর পূরণ করুন";
    return;
  }
  $("authBtn").disabled = true;
  $("authError").textContent = "";
  try {
    if (isLogin) {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, "users", cred.user.uid), {
        uid: cred.user.uid, name, email, createdAt: serverTimestamp()
      });
    }
  } catch (e) {
    $("authError").textContent = errorText(e.code);
  } finally {
    $("authBtn").disabled = false;
  }
};

$("logoutBtn").onclick = () => signOut(auth);

if (configured) {
  onAuthStateChanged(auth, (user) => {
    if (unsubUsers) { unsubUsers(); unsubUsers = null; }
    if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
    if (user) {
      show("users");
      loadUsers(user);
    } else {
      show("auth");
    }
  });
}

// ইউজার তালিকা
function loadUsers(me) {
  unsubUsers = onSnapshot(collection(db, "users"), (snap) => {
    const list = $("userList");
    list.textContent = "";
    const others = snap.docs.map(d => d.data()).filter(u => u.uid !== me.uid);
    if (others.length === 0) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "এখনো কেউ নেই। বন্ধুকে অ্যাপে সাইন আপ করতে বলুন।";
      list.appendChild(d);
      return;
    }
    others.forEach((u) => {
      const row = document.createElement("div");
      row.className = "user";
      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = (u.name || "?").charAt(0).toUpperCase();
      const info = document.createElement("div");
      const nm = document.createElement("b");
      nm.textContent = u.name || "নামহীন";
      const em = document.createElement("small");
      em.textContent = u.email || "";
      info.append(nm, em);
      row.append(av, info);
      row.onclick = () => openChat(me, u);
      list.appendChild(row);
    });
  });
}

// চ্যাট
function chatIdFor(a, b) { return [a, b].sort().join("_"); }

function fmtTime(ts) {
  if (!ts) return "";
  const d = ts.toDate();
  const h = d.getHours() % 12 || 12;
  const m = String(d.getMinutes()).padStart(2, "0");
  return h + ":" + m + (d.getHours() >= 12 ? " PM" : " AM");
}

function openChat(me, other) {
  otherUser = other;
  $("chatName").textContent = other.name || "নামহীন";
  show("chat");
  const box = $("messages");
  box.textContent = "";
  const q = query(collection(db, "chats", chatIdFor(me.uid, other.uid), "messages"), orderBy("createdAt"));
  unsubMsgs = onSnapshot(q, (snap) => {
    box.textContent = "";
    snap.docs.forEach((d) => {
      const m = d.data();
      const el = document.createElement("div");
      el.className = "msg" + (m.senderId === me.uid ? " me" : "");
      el.append(document.createTextNode(m.text || ""));
      const t = document.createElement("small");
      t.textContent = fmtTime(m.createdAt);
      el.appendChild(t);
      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  });
}

$("backBtn").onclick = () => {
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  show("users");
};

$("sendForm").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("msgInput").value.trim();
  const me = auth.currentUser;
  if (!text || !me || !otherUser) return;
  $("msgInput").value = "";
  await addDoc(collection(db, "chats", chatIdFor(me.uid, otherUser.uid), "messages"), {
    text, senderId: me.uid, createdAt: serverTimestamp()
  });
};
</script>
</body>
</html>
