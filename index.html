<!doctype html>
<html lang=bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6246e">
<title>Pro chat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #fff7fa;
  --surface: #ffffff;
  --fg: #2b1620;
  --muted: #8c6a79;
  --line: #f5dde7;
  --pink: #d6246e;
  --pink-2: #ff5c9d;
  --pink-soft: #ffe4ef;
  --on-pink: #ffffff;
  --mine: #fcd3e4;
  --theirs: #ffffff;
  --chat-bg: #fdeef4;
  --online: #22b565;
  --danger: #c62828;
  --shadow: 0 6px 24px -10px rgba(190, 30, 100, .45);
  --font: "Hind Siliguri", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a0f15;
    --surface: #26161e;
    --fg: #fbe9f1;
    --muted: #c79bb0;
    --line: #3b2330;
    --pink: #ff4d94;
    --pink-2: #ff7ab0;
    --pink-soft: #3d1f2e;
    --mine: #6a2447;
    --theirs: #2d1b25;
    --chat-bg: #170d13;
    --danger: #ff8a80;
    --shadow: 0 6px 24px -10px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; overflow: hidden; }
button, input { font-family: inherit; font-size: 1rem; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--pink-2); outline-offset: 2px; }

#app { position: relative; height: 100%; max-width: 620px; margin: 0 auto; background: var(--bg); overflow: hidden; }
@media (min-width: 700px) { #app { box-shadow: 0 0 60px -20px rgba(190, 30, 100, .35); } }
.view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); }
.view.active { display: flex; }

/* header */
.head { flex: none; display: flex; align-items: center; gap: 12px; color: var(--on-pink);
  background: linear-gradient(135deg, #d6246e, #ff5c9d); padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.head h1 { margin: 0; font-size: 1.2rem; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .sub { font-size: .8rem; opacity: .92; display: block; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .titles { flex: 1; min-width: 0; }
.head .titles h1 { flex: none; }
.head .logo-sm { width: 32px; height: 32px; border-radius: 9px; flex: none; }
.icon-btn { background: rgba(255, 255, 255, .18); border: 0; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

/* avatar */
.avatar { --s: 44px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; position: relative; overflow: hidden;
  background: linear-gradient(135deg, #ff5c9d, #d6246e); color: #fff; display: grid; place-items: center;
  font-weight: 700; font-size: calc(var(--s) * .42); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avwrap { position: relative; flex: none; }
.dot { position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--online); border: 2px solid var(--surface); }

/* panes + lists */
.pane { flex: 1; min-height: 0; overflow-y: auto; display: none; padding-bottom: 12px; }
.pane.active { display: block; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.row.tap { cursor: pointer; }
.row.tap:active { background: var(--pink-soft); }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .small { font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { font-size: .76rem; color: var(--muted); }
.unread { min-width: 20px; height: 20px; border-radius: 10px; background: var(--pink); color: #fff; font-size: .72rem; display: grid; place-items: center; padding: 0 6px; margin-top: 2px; }
.section { padding: 14px 16px 6px; font-size: .82rem; font-weight: 600; color: var(--pink); letter-spacing: .02em; }
.empty { padding: 36px 24px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); margin-bottom: 4px; font-size: 1.05rem; }

.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #d6246e, #ff5c9d); box-shadow: var(--shadow); }
.btn:disabled { opacity: .6; box-shadow: none; }
.btn.sm { padding: 6px 14px; font-size: .9rem; border-radius: 10px; }
.btn.ghost { background: var(--pink-soft); color: var(--pink); box-shadow: none; }
.btn.danger { background: transparent; color: var(--danger); box-shadow: none; border: 1px solid var(--line); }
.field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.field:focus { outline: none; border-color: var(--pink-2); }

.search { padding: 12px 16px; background: var(--bg); position: sticky; top: 0; z-index: 2; }

/* bottom nav */
.nav { flex: none; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { flex: 1; border: 0; background: none; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); font-size: .76rem; position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button.active { color: var(--pink); font-weight: 600; }
.nav .badge { position: absolute; top: 4px; left: 54%; min-width: 18px; height: 18px; border-radius: 9px; background: var(--pink); color: #fff; font-size: .68rem; display: grid; place-items: center; padding: 0 5px; }

.fab { position: absolute; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); border-radius: 28px; padding: 13px 20px; display: flex; align-items: center; gap: 8px; z-index: 3; }
.fab svg { width: 20px; height: 20px; }

/* auth */
#auth { align-items: center; justify-content: center; padding: 24px; overflow-y: auto; background: linear-gradient(160deg, #fff0f6, #ffd9e8 60%, #ffc2da); }
@media (prefers-color-scheme: dark) { #auth { background: linear-gradient(160deg, #240f19, #3a1426 60%, #4d1633); } }
.auth-box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; margin: auto; }
.auth-box .logo { width: 92px; height: 92px; border-radius: 26px; align-self: center; box-shadow: var(--shadow); }
.auth-box h1 { margin: 6px 0 0; text-align: center; font-size: 1.9rem; color: var(--pink); }
.auth-box .tag { margin: -6px 0 6px; text-align: center; color: var(--muted); }
.auth-box .hint { font-size: .82rem; color: var(--muted); margin-top: -4px; }
.error { color: var(--danger); text-align: center; min-height: 1.3em; font-size: .92rem; }
.linkbtn { background: none; border: 0; color: var(--pink); font-weight: 600; padding: 6px; }
.auth-box .btn { padding: 13px; }

/* chat */
#msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 10px; background: var(--chat-bg); display: flex; flex-direction: column; gap: 3px; }
.m { display: flex; flex-direction: column; max-width: 82%; }
.m.mine { align-self: flex-end; align-items: flex-end; }
.m.theirs { align-self: flex-start; align-items: flex-start; }
.bubble { padding: 7px 11px 4px; border-radius: 16px; background: var(--theirs); box-shadow: 0 1px 1px rgba(120, 30, 70, .12); word-break: break-word; overflow-wrap: anywhere; min-width: 64px; }
.m.mine .bubble { background: var(--mine); border-bottom-right-radius: 5px; }
.m.theirs .bubble { border-bottom-left-radius: 5px; }
.bubble .who { font-size: .78rem; font-weight: 700; color: var(--pink); }
.bubble .txt { white-space: pre-wrap; }
.bubble .gone { font-style: italic; color: var(--muted); }
.bubble img.pic { display: block; max-width: min(260px, 100%); max-height: 320px; border-radius: 10px; margin: 2px 0; cursor: zoom-in; }
.bubble .meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: .68rem; color: var(--muted); margin-top: 1px; }
.tick { font-weight: 700; letter-spacing: -2px; }
.tick.seen { color: #e0207a; }
@media (prefers-color-scheme: dark) { .tick.seen { color: #ff8cbc; } }
.acts { display: none; margin-top: 3px; }
.m.sel .acts { display: block; }
.acts button { border: 1px solid var(--line); background: var(--surface); color: var(--danger); border-radius: 14px; padding: 3px 12px; font-size: .85rem; }
.composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.composer .field { border-radius: 22px; padding: 10px 16px; max-height: 120px; resize: none; line-height: 1.4; }
.composer .circle { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; }
.composer .attach { background: var(--pink-soft); color: var(--pink); }
.composer .send { background: linear-gradient(135deg, #d6246e, #ff5c9d); color: #fff; }
.composer svg { width: 22px; height: 22px; }

/* profile */
.prof { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 20px 8px; }
.prof .avatar { --s: 112px; }
.prof .box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; }
.prof .info { text-align: center; color: var(--muted); font-size: .92rem; }

/* misc */
.check { width: 22px; height: 22px; accent-color: var(--pink); flex: none; }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: #3a1a29; color: #fff; padding: 10px 18px; border-radius: 22px; font-size: .92rem; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#viewer { position: fixed; inset: 0; background: rgba(20, 5, 12, .94); z-index: 60; display: grid; place-items: center; padding: 12px; }
#viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">

  <!-- ===== লগইন / সাইন আপ ===== -->
  <section id="auth" class="view active">
    <div class="auth-box">
      <img class="logo" src="icon-192.png" alt="Pro chat">
      <h1>Pro chat</h1>
      <p class="tag">বন্ধুদের সাথে সহজ চ্যাট</p>
      <input id="name" class="field" type="text" placeholder="আপনার নাম" autocomplete="name" hidden>
      <input id="login" class="field" type="text" placeholder="ইমেইল বা ফোন নম্বর" autocomplete="username" autocapitalize="none">
      <input id="password" class="field" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="current-password">
      <div id="authHint" class="hint" hidden>ফোন নম্বর দিলে পরে সেই নম্বর ও পাসওয়ার্ড দিয়েই লগইন করতে পারবেন। পাসওয়ার্ড মনে রাখুন, ভুলে গেলে ফেরত পাওয়ার উপায় নেই।</div>
      <div id="authError" class="error" role="alert"></div>
      <button id="authBtn" class="btn">লগইন</button>
      <button id="toggleBtn" class="linkbtn">অ্যাকাউন্ট নেই? সাইন আপ করুন</button>
    </div>
  </section>

  <!-- ===== মূল পর্দা ===== -->
  <section id="main" class="view">
    <header class="head">
      <img class="logo-sm" src="icon-192.png" alt="">
      <h1 id="mainTitle">Pro chat</h1>
    </header>

    <div id="paneChats" class="pane active">
      <div id="chatList"></div>
    </div>

    <div id="paneFriends" class="pane">
      <div class="search">
        <form id="searchForm" style="display:flex;gap:8px" autocomplete="off">
          <input id="searchBox" class="field" type="search" inputmode="search" placeholder="বন্ধুর ফোন নম্বর বা ইমেইল" autocomplete="off">
          <button class="btn" type="submit">খুঁজুন</button>
        </form>
        <div style="font-size:.8rem;color:var(--muted);margin:6px 2px 0">নাম দিয়ে খোঁজা যায় না। সঠিক নম্বর বা ইমেইল জানা থাকলে তবেই পাওয়া যাবে।</div>
      </div>
      <div id="searchResults"></div>
      <div id="requestBox"></div>
      <div id="friendList"></div>
    </div>

    <div id="paneProfile" class="pane">
      <div class="prof">
        <div id="profAvatar"></div>
        <div class="box">
          <button id="photoBtn" class="btn ghost">ছবি বদলান</button>
          <input id="photoInput" type="file" accept="image/*" hidden>
          <input id="profName" class="field" type="text" placeholder="আপনার নাম">
          <button id="saveName" class="btn">নাম সংরক্ষণ</button>
          <div id="profInfo" class="info"></div>
          <button id="installBtn" class="btn ghost" hidden>হোম স্ক্রিনে অ্যাপ ইনস্টল করুন</button>
          <button id="logoutBtn" class="btn danger">লগআউট</button>
        </div>
      </div>
    </div>

    <button id="newGroupBtn" class="btn fab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>নতুন গ্রুপ
    </button>

    <nav class="nav">
      <button data-tab="Chats" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>চ্যাট<span id="badgeChats" class="badge" hidden></span>
      </button>
      <button data-tab="Friends">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 5.5a3.2 3.2 0 0 1 0 6.2M18.5 14.3c2 .6 3.2 2.5 3.2 5.2"/></svg>বন্ধু<span id="badgeFriends" class="badge" hidden></span>
      </button>
      <button data-tab="Profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>আমি
      </button>
    </nav>
  </section>

  <!-- ===== চ্যাট ===== -->
  <section id="chat" class="view">
    <header class="head">
      <button id="backBtn" class="icon-btn" aria-label="পিছনে"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="chatAvatar"></div>
      <div class="titles"><h1 id="chatTitle"></h1><span id="chatSub" class="sub"></span></div>
    </header>
    <div id="msgs"></div>
    <form id="sendForm" class="composer" autocomplete="off">
      <button type="button" id="attachBtn" class="circle attach" aria-label="ছবি পাঠান">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
      </button>
      <input id="imgInput" type="file" accept="image/*" hidden>
      <input id="msgInput" class="field" type="text" placeholder="মেসেজ লিখুন" enterkeyhint="send">
      <button type="submit" class="circle send" aria-label="পাঠান">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.9a.6.6 0 0 0 0-1.1L3.4 3.6a.6.6 0 0 0-.85.7L4.9 11l9 1-9 1-2.35 6.7a.6.6 0 0 0 .85.7z"/></svg>
      </button>
    </form>
  </section>

  <!-- ===== নতুন গ্রুপ ===== -->
  <section id="group" class="view">
    <header class="head">
      <button id="groupBack" class="icon-btn" aria-label="পিছনে"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1>নতুন গ্রুপ</h1>
    </header>
    <div style="padding:12px 16px"><input id="groupName" class="field" type="text" placeholder="গ্রুপের নাম" maxlength="40"></div>
    <div class="section">বন্ধুদের বেছে নিন</div>
    <div id="groupPick" class="pane active" style="padding-bottom:90px"></div>
    <div style="padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)">
      <button id="groupCreate" class="btn" style="width:100%;padding:13px">গ্রুপ তৈরি করুন</button>
    </div>
  </section>
</div>

<div id="toast" role="status"></div>
<div id="viewer" hidden><img alt=""></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJQWzfOa5bYCSnzKJY6AOCqNVkAYYYDyE",
  authDomain: "prochat-753ab.firebaseapp.com",
  projectId: "prochat-753ab",
  storageBucket: "prochat-753ab.firebasestorage.app",
  messagingSenderId: "849385728672",
  appId: "1:849385728672:web:b5af76a78541e4657ab7c5"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------------- helpers ---------------- */
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const SNAP = { serverTimestamps: "estimate" };
const ms = (t) => (t && typeof t.toMillis === "function") ? t.toMillis() : 0;
const fid = (a, b) => [a, b].sort().join("_");
const PHONE_DOMAIN = "@phone.prochat.app";

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}
let lastErrToast = 0;
function onErr(e) {
  console.error(e);
  if (Date.now() - lastErrToast < 6000) return;
  lastErrToast = Date.now();
  if (e && e.code === "permission-denied") toast("ডেটাবেসের নিয়ম (Rules) ঠিক নেই। নতুন নিয়ম প্রকাশ করা হয়েছে কি?");
  else toast("কিছু একটা সমস্যা হয়েছে, আবার চেষ্টা করুন");
}

function normPhone(s) {
  s = String(s).replace(/[০-৯]/g, (c) => "০১২৩৪৫৬৭৮৯".indexOf(c));
  let d = s.replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("880")) { /* ok */ }
  else if (d.startsWith("0") && d.length === 11) d = "880" + d.slice(1);
  else if (d.length === 10 && d.startsWith("1")) d = "880" + d;
  return (d.length >= 10 && d.length <= 15) ? d : null;
}
function parseLogin(raw) {
  const v = raw.trim();
  if (v.includes("@")) return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) ? { email: v.toLowerCase(), phone: "" } : null;
  const p = normPhone(v);
  return p ? { email: p + PHONE_DOMAIN, phone: p } : null;
}
function authError(code) {

function fmtTime(t) {
  const m = ms(t); if (!m) return "";
  try { return new Date(m).toLocaleTimeString("bn-BD", { hour: "numeric", minute: "2-digit" }); }
  catch { return new Date(m).toLocaleTimeString(); }
}
function fmtListTime(t) {
  const m = ms(t); if (!m) return "";
  const d = new Date(m), now = new Date();
  if (d.toDateString() === now.toDateString()) return fmtTime(t);
  try { return d.toLocaleDateString("bn-BD", { day: "numeric", month: "short" }); } catch { return d.toLocaleDateString(); }
}
const ONLINE_MS = 75000;
const isOnline = (p) => p && p.lastSeen && (Date.now() - ms(p.lastSeen) < ONLINE_MS);
function statusText(p) {
  if (!p || !p.lastSeen) return "";
  if (isOnline(p)) return "অনলাইন";
  const d = new Date(ms(p.lastSeen)), now = new Date();
  if (d.toDateString() === now.toDateString()) return "শেষ দেখা: আজ " + fmtTime(p.lastSeen);
  return "শেষ দেখা: " + fmtListTime(p.lastSeen);
}
const initial = (n) => { n = (n || "?").trim(); return n ? Array.from(n)[0].toUpperCase() : "?"; };
function avatar(p, size, withDot) {
  const wrap = el("div", "avwrap");
  const a = el("div", "avatar"); a.style.setProperty("--s", size + "px");
  if (p && p.photo) { const i = document.createElement("img"); i.src = p.photo; i.alt = ""; a.appendChild(i); }
  else a.textContent = initial(p && p.name);
  wrap.appendChild(a);
  if (withDot && isOnline(p)) wrap.appendChild(el("span", "dot"));
  return wrap;
}

/* image helpers: photos are shrunk and stored directly in the database (no paid Storage needed) */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}
async function shrink(file, max) {
  const img = await loadImage(file);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
  let q = 0.72, out = c.toDataURL("image/jpeg", q);
  while (out.length > 800000 && q > 0.35) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
  if (out.length > 800000) throw new Error("big");
  return out;
}
async function squarePhoto(file, size) {
  const img = await loadImage(file);
  const m = Math.min(img.width, img.height);
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
  return c.toDataURL("image/jpeg", 0.8);
}

async function ensureUserDoc(user) {

      photo: "", createdAt: serverTimestamp(), lastSeen: serverTimestamp()

async function startSession(user) {
  if (started) return; started = true; me = user;

  sessionUnsubs.push(onSnapshot(query(collection(db, "friendships"), where("users", "array-contains", user.uid)), (snap) => {
    friendships = snap.docs.map((d) => ({ id: d.id, ...d.data(SNAP) }));
    friendships.forEach((f) => f.users.forEach(ensureProfile));

/* search: nobody is listed. Only an exact phone number or e-mail finds a person (like WhatsApp). */
let searchState = { status: "idle", uid: null };
$("searchForm").addEventListener("submit", (e) => { e.preventDefault(); runSearch(); });
$("searchBox").addEventListener("input", () => {
  if (!$("searchBox").value.trim()) { searchState = { status: "idle", uid: null }; renderSearchResults(); }
});
async function runSearch() {
  const q = $("searchBox").value.trim();
  if (!q) { searchState = { status: "idle", uid: null }; return renderSearchResults(); }
  let key = null;
  if (q.includes("@")) { if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(q)) key = "e_" + q.toLowerCase(); }
  else { const p = normPhone(q); if (p) key = "p_" + p; }
  if (!key) { searchState = { status: "invalid", uid: null }; return renderSearchResults(); }
  searchState = { status: "loading", uid: null }; renderSearchResults();
  try {
    const l = await getDoc(doc(db, "lookup", key));
    if (!l.exists()) searchState = { status: "none", uid: null };
    else if (l.data().uid === me.uid) searchState = { status: "self", uid: null };
    else {
      const uid = l.data().uid, u = await getDoc(doc(db, "users", uid));
      if (u.exists()) { profiles.set(uid, u.data(SNAP)); ensureProfile(uid); searchState = { status: "found", uid }; }
      else searchState = { status: "none", uid: null };
    }
  } catch (e) { onErr(e); searchState = { status: "idle", uid: null }; }
  renderSearchResults();
}
function renderSearchResults() {
  const box = $("searchResults"); box.textContent = "";
  const s = searchState; if (s.status === "idle") return;
  box.appendChild(el("div", "section", "খোঁজার ফলাফল"));
  const msg = {
    loading: "খোঁজা হচ্ছে…",
    invalid: "সঠিক ফোন নম্বর (যেমন 01712345678) বা ইমেইল লিখুন",
    none: "এই নম্বর বা ইমেইলে কেউ নেই",
    self: "এটা আপনার নিজের নম্বর/ইমেইল"
  }[s.status];
  if (msg) { box.appendChild(el("div", "empty", msg)); return; }
  [s.uid].forEach((uid) => {
    const rel = relation(uid); let btn;
    if (rel === "none") btn = actionBtn("যোগ করুন", "", async () => {
      btn.disabled = true;

}

function closeChatListeners() {
  if (unsubMsgs) unsubMsgs(); if (unsubChat) unsubChat();
  unsubMsgs = unsubChat = null; msgEls.clear(); lastMsgs = []; markedFor = null;
}
function openChat(id, replaceHistory, seed) {
  closeChatListeners();
  current = id; currentData = chats.find((c) => c.id === id) || (seed ? { id, reads: {}, ...seed } : null);
  $("msgs").textContent = ""; $("msgInput").value = "";
  if (replaceHistory) history.replaceState({ v: "chat" }, ""); else history.pushState({ v: "chat" }, "");
  show("chat"); renderChatHeader();
  unsubChat = onSnapshot(doc(db, "chats", id), (s) => {
    if (!s.exists()) return;
    currentData = { id, ...s.data(SNAP) };
    currentData.members.forEach(ensureProfile);
    renderChatHeader(); updateMsgMeta(); markRead();
  }, onErr);
  unsubMsgs = onSnapshot(query(collection(db, "chats", id, "messages"), orderBy("createdAt", "desc"), limit(120)), (snap) => {
    lastMsgs = snap.docs.map((d) => ({ id: d.id, pending: d.metadata.hasPendingWrites, ...d.data(SNAP) })).reverse();
    paintMessages(); markRead();
  }, onErr);
}
$("backBtn").onclick = () => history.back();
window.addEventListener("popstate", () => {
  if ($("chat").classList.contains("active")) { closeChatListeners(); current = null; currentData = null; show("main"); }
  else if ($("group").classList.contains("active")) show("main");
});

function renderChatHeader() {
  if (!current || !me || !$("chat").classList.contains("active")) return;
  const c = currentData; if (!c) return;
  const holder = $("chatAvatar"); holder.textContent = "";
  if (c.type === "group") {
    holder.appendChild(avatar({ name: c.name }, 40));
    $("chatTitle").textContent = c.name || "গ্রুপ";
    $("chatSub").textContent = c.members.map(pName).join(", ");
  } else {
    const o = c.members.find((u) => u !== me.uid);
    holder.appendChild(avatar(P(o), 40, true));
    $("chatTitle").textContent = pName(o);
    $("chatSub").textContent = statusText(P(o));
  }
}

/* ---------------- messages ---------------- */
function tickState(m) {
  if (m.pending) return "pending";
  const c = currentData; if (!c) return "sent";
  const others = c.members.filter((u) => u !== me.uid); const t = ms(m.createdAt);
  const seen = others.length && t && others.every((u) => ms((c.reads || {})[u]) >= t);
  return seen ? "seen" : "sent";
}
function buildMsg(m) {
  const mine = m.senderId === me.uid;
  const wrap = el("div", "m " + (mine ? "mine" : "theirs"));
  const bubble = el("div", "bubble");
  const body = el("div", "body");
  const meta = el("div", "meta"); const time = el("span"); const tick = el("span", "tick");
  meta.append(time); if (mine) meta.append(tick);
  bubble.append(body, meta); wrap.appendChild(bubble);
  wrap._r = { mine, bubble, body, time, tick, who: null, acts: null };
  if (mine) {
    const acts = el("div", "acts"); const b = el("button", null, "🗑 সবার জন্য মুছুন");
    b.onclick = (ev) => { ev.stopPropagation(); deleteMsg(m.id); };
    acts.appendChild(b); wrap.appendChild(acts); wrap._r.acts = acts;
    bubble.onclick = () => { if (!wrap._deleted) wrap.classList.toggle("sel"); };
  }
  return wrap;
}
function fillMsg(node, m) {
  const r = node._r; const sig = (m.deleted ? "d" : "") + "|" + m.text + "|" + (m.image ? m.image.length : 0);
  if (node._sig !== sig) {
    node._sig = sig; r.body.textContent = ""; node._deleted = !!m.deleted;
    if (m.deleted) { r.body.appendChild(el("div", "gone", "🚫 মেসেজটি মুছে ফেলা হয়েছে")); node.classList.remove("sel"); }
    else {
      if (m.image) { const img = document.createElement("img"); img.className = "pic"; img.src = m.image; img.alt = "ছবি"; img.onclick = (ev) => { ev.stopPropagation(); openViewer(m.image); }; r.body.appendChild(img); }
      if (m.text) r.body.appendChild(el("div", "txt", m.text));
    }
  }
  node._m = m;
}
function paintMessages() {
  const box = $("msgs");
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140 || !box.children.length;
  const ids = new Set(lastMsgs.map((m) => m.id));
  [...msgEls.keys()].forEach((k) => { if (!ids.has(k)) { msgEls.get(k).remove(); msgEls.delete(k); } });
  lastMsgs.forEach((m, i) => {
    let node = msgEls.get(m.id);
    if (!node) { node = buildMsg(m); msgEls.set(m.id, node); }
    fillMsg(node, m);
    if (box.children[i] !== node) box.insertBefore(node, box.children[i] || null);
  });
  updateMsgMeta();
  if (near) box.scrollTop = box.scrollHeight;
}
function updateMsgMeta() {
  if (!current) return;
  const group = currentData && currentData.type === "group";
  msgEls.forEach((node) => {
    const m = node._m, r = node._r; if (!m) return;
    r.time.textContent = fmtTime(m.createdAt);
    if (r.mine) {
      const s = tickState(m);
      r.tick.textContent = s === "pending" ? "🕓" : "✓✓";
      if (s === "sent") r.tick.textContent = "✓";
      r.tick.className = "tick" + (s === "seen" ? " seen" : "");
    } else if (group) {
      if (!r.who) { r.who = el("div", "who"); r.bubble.insertBefore(r.who, r.body); }
      r.who.textContent = pName(m.senderId);
    }
  });
}
function markRead() {
  if (!current || !currentData || document.hidden) return;
  const last = lastMsgs[lastMsgs.length - 1];
  if (!last || last.senderId === me.uid || last.pending) return;
  const t = ms(last.createdAt), mineAt = ms((currentData.reads || {})[me.uid]);
  if (mineAt && mineAt >= t) return;
  if (markedFor === last.id) return; markedFor = last.id;
  updateDoc(doc(db, "chats", current), { ["reads." + me.uid]: serverTimestamp() }).catch(() => { markedFor = null; });
}

async function sendMessage(text, image) {
  if (!current) return;
  const id = current;
  try {
    await addDoc(collection(db, "chats", id, "messages"), { text, image, senderId: me.uid, createdAt: serverTimestamp(), deleted: false });
    await updateDoc(doc(db, "chats", id), {
      lastMessage: image ? "📷 ছবি" : text.slice(0, 80), lastSender: me.uid,
      updatedAt: serverTimestamp(), ["reads." + me.uid]: serverTimestamp()
    });
  } catch (e) { onErr(e); toast("মেসেজ পাঠানো যায়নি"); }
}
$("sendForm").onsubmit = (e) => {
  e.preventDefault();
  const t = $("msgInput").value.trim(); if (!t) return;
  $("msgInput").value = ""; sendMessage(t, "");
};
$("attachBtn").onclick = () => $("imgInput").click();
$("imgInput").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  toast("ছবি পাঠানো হচ্ছে…");
  try { const data = await shrink(f, 1000); await sendMessage("", data); }
  catch (er) { onErr(er); toast("ছবিটি পাঠানো গেল না, অন্য ছবি দিন"); }
};
async function deleteMsg(mid) {
  try { await updateDoc(doc(db, "chats", current, "messages", mid), { deleted: true, text: "", image: "" }); }
  catch (e) { onErr(e); }
}
function openViewer(src) { const v = $("viewer"); v.querySelector("img").src = src; v.hidden = false; }
$("viewer").onclick = () => { $("viewer").hidden = true; };

/* ---------------- groups ---------------- */
$("newGroupBtn").onclick = () => {
  $("groupName").value = "";
  const box = $("groupPick"); box.textContent = "";
  const friends = friendships.filter((f) => f.status === "accepted").map((f) => f.users.find((u) => u !== me.uid))
    .sort((a, b) => pName(a).localeCompare(pName(b)));
  if (!friends.length) {
    const e = el("div", "empty"); e.append(el("b", null, "আগে বন্ধু যোগ করুন"), "গ্রুপে শুধু বন্ধুদের রাখা যায়।"); box.appendChild(e);
  }
  friends.forEach((uid) => {
    const row = el("label", "row tap"); row.appendChild(avatar(P(uid), 42));
    const g = el("div", "grow"); g.appendChild(el("div", "name", pName(uid))); row.appendChild(g);
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "check"; cb.value = uid; row.appendChild(cb);
    box.appendChild(row);
  });
  history.pushState({ v: "group" }, ""); show("group");
};
$("groupBack").onclick = () => history.back();
$("groupCreate").onclick = async () => {
  const name = $("groupName").value.trim();
  const picked = [...$("groupPick").querySelectorAll("input:checked")].map((i) => i.value);
  if (!name) return toast("গ্রুপের নাম লিখুন");
  if (!picked.length) return toast("কমপক্ষে একজন বন্ধু বেছে নিন");
  $("groupCreate").disabled = true;
  try {
    const ref = doc(collection(db, "chats"));
    await setDoc(ref, {
      type: "group", name, members: [me.uid, ...picked], createdBy: me.uid, reads: {},
      createdAt: serverTimestamp(), updatedAt: serverTimestamp(), lastMessage: "গ্রুপ তৈরি হয়েছে", lastSender: me.uid
    });
    openChat(ref.id, true, { type: "group", name, members: [me.uid, ...picked] });
  } catch (e) { onErr(e); toast("গ্রুপ তৈরি করা যায়নি"); }
  finally { $("groupCreate").disabled = false; }
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
